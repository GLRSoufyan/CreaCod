<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Met Volume</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .volume-container {
      width: 80%;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .volume-bar {
      width: 100%;
      height: 20px;
      background-color: #ddd;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }
    .volume-bar div {
      height: 100%;
      width: 0%;
      background-color: #4caf50;
      transition: width 1s linear;
    }
    .volume-label {
      margin-top: 10px;
      font-size: 1rem;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #4caf50;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Timer with Volume Animation</h1>
  <div class="volume-container">
    <div class="volume-bar">
      <div id="volume-fill"></div>
    </div>
    <div class="volume-label" id="volume-label">Volume: 0%</div>
  </div>
  <button id="start-button">Start</button>

  <audio id="background-music" src="BackgroundMusic.mp3" loop></audio>

  <script>
    const volumeFill = document.getElementById("volume-fill");
    const volumeLabel = document.getElementById("volume-label");
    const backgroundMusic = document.getElementById("background-music");
    const startButton = document.getElementById("start-button");

    let increasing = true;
    let volume = 0;

    function updateVolume() {
      if (increasing) {
        volume += 1; // Increment volume
        if (volume >= 100) {
          increasing = false; // Start decreasing
        }
      } else {
        volume -= 1; // Decrement volume
        if (volume <= 0) {
          increasing = true; // Start increasing
        }
      }

      // Update volume bar and label
      volumeFill.style.width = `${volume}%`;
      volumeLabel.textContent = `Volume: ${volume}%`;

      // Adjust music volume (from 0.0 to 1.0)
      backgroundMusic.volume = volume / 100;

      // Repeat every 600ms (smooth transition effect)
      setTimeout(updateVolume, 600);
    }

    // Start button event listener
    startButton.addEventListener("click", () => {
      backgroundMusic.play().then(() => {
        updateVolume();
        startButton.disabled = true; // Disable button after starting
      }).catch((error) => {
        console.error("Audio playback failed:", error);
      });
    });
  </script>
</body>
</html>
